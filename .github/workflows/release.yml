name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*}; GOARCH=${target#*/}; stage="dist/$GOOS-$GOARCH"; mkdir -p "$stage"
            extension=""; [ "$GOOS" = windows ] && extension=".exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$stage/htb$extension" ./cmd/htb
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$stage/htbd$extension" ./cmd/htbd
            if [ "$GOOS" = windows ]; then (cd "$stage" && zip "../htb_${GOOS}_${GOARCH}.zip" "htb$extension" "htbd$extension"); else tar -C "$stage" -czf "dist/htb_${GOOS}_${GOARCH}.tar.gz" "htb$extension" "htbd$extension"; fi
          done
          find dist -mindepth 1 -type d -exec rm -rf {} +
          cp install.sh dist/install.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/* > dist/checksums.txt
          gh release create "${{ github.ref_name }}" dist/* --generate-notes
