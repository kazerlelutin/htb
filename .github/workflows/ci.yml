name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: htb
          POSTGRES_PASSWORD: htb
          POSTGRES_DB: htb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U htb -d htb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HTBD_TEST_DATABASE_URL: postgres://htb:htb@localhost:5432/htb_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/htbd ./cmd/htb
      - run: sh -n install.sh
